[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# SPA fallback — client-side routing needs every unknown path to serve
# index.html rather than a 404. (This also happens to fix Beta Report
# Suggestion 8 — no custom 404 page — since routing will now handle
# unknown paths through the app's own router instead of a bare error.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
